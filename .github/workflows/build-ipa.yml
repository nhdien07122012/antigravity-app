name: Build Antigravity iOS IPA (Sideload)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application (Vite -> dist)
        run: npm run build

      - name: Sync iOS Native Platform (Capacitor)
        run: |
          npx cap sync ios
          cd ios/App
          pod install

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Package Unsigned IPA for Sideloading
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r AntigravityMobile.ipa Payload
          echo "IPA Package generated successfully at ios/App/build/AntigravityMobile.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityMobile-IPA
          path: ios/App/build/AntigravityMobile.ipa
          retention-days: 14

      - name: Create or Update GitHub Release with Direct IPA Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Antigravity Mobile IPA (Direct Download)"
          body: |
            ## 📱 Tải Trực Tiếp File IPA Antigravity Mobile
            - **Mục đích:** Cài đặt trực tiếp lên iPhone thông qua AltStore, SideStore, TrollStore, hoặc Sideloadly.
            - **Bản dựng:** `v1.0.0`
            - **Cách cài:** Bấm tải file `AntigravityMobile.ipa` bên dưới, mở bằng AltStore hoặc chia sẻ sang SideStore/TrollStore trên iPhone.
          files: ios/App/build/AntigravityMobile.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
